
    <section>
       <h1>Alta de productos</h1>

        <form action="#" class="alta-form">
            <!-- campo nombre -->
             <div class="input-group">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" name="nombre">
             </div>

              <!-- campo precio -->
             <div class="input-group">
                <label for="precio">precio</label>
                <input id="precio" step="any" type="number" name="precio">
             </div>

              <!-- campo stock -->
             <div class="input-group">
                <label for="stock">stock</label>
                <input id="stock" type="number" name="stock">
             </div>

              <!-- campo marca -->
             <div class="input-group">
                <label for="marca">marca
                </label>
                <input id="marca" type="text" name="marca">
             </div>

              <!-- campo categoria -->
             <div class="input-group">
                <label for="categoria">categoria</label>
                <input id="categoria" type="text" name="categoria">
             </div>
             
              <!-- campo descripcion corta -->
             <div class="input-group">
                <label for="descripcion-corta">Descripción corta</label>
                <input id="descripcion-corta" type="text" name="descripcion-corta">
             </div>

            <!-- campo descripcion larga -->
             <div class="input-group">
                <label for="descripcion-larga">Descripción larga</label>
                <input id="descripcion-larga" type="text" name="descripcion-larga">
             </div>

             <!-- Edad desde  -->
             <div class="input-group">
                <label for="edad-desde">Edad desde</label>
                <input id="edad-desde" type="number" name="edad-desde">
             </div>

             <!-- Edad hasta -->
            <div class="input-group">
                <label for="edad-hasta">Edad hasta</label>
                <input id="edad-hasta" type="number" name="edad-hasta">
             </div>

            <!-- campo foto -->
             <div class="input-group">
                <label for="foto">foto</label>
                <input id="foto" type="text" name="foto">
             </div>

              <!-- campo envio -->
             <div class="input-group">
                <input id="envio" type="checkbox" name="envio">
                <label for="envio">Envío bonificado</label>   
             </div>

             <!-- Boton de envio -->
              <button>Agregar un producto</button>
        </form>

        <hr>
        <h2>Listado de productos disponibles</h2>
    <div class="responsive">
        <table>
            
        </table>
    </div>
    </section>
